name: Verify Artful build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: artful-verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - name: Install browser smoke-test tools
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.57.0
          npx playwright install --with-deps chromium
      - name: Browser smoke test
        run: |
          set -euo pipefail
          npm run start -- --hostname 127.0.0.1 --port 3000 > /tmp/hiarchit-next.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:3000/ > /dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/ > /dev/null
          node scripts/smoke.mjs
          # Strict Lighthouse lab gate — mobile and desktop both >=90.
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)"
          test -n "$CHROME_PATH"
          npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/ --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=smoke-artifacts/lighthouse-mobile.json --quiet
          npx --yes lighthouse@12.8.2 http://127.0.0.1:3000/ --preset=desktop --only-categories=performance --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path=smoke-artifacts/lighthouse-desktop.json --quiet
          node scripts/lighthouse-budget.mjs
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artful-browser-smoke
          path: smoke-artifacts/
          if-no-files-found: ignore
